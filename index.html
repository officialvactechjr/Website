<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The club's logo, as flat rasters. `og.jpg` is the social card. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="canonical" href="https://vactechjr.pages.dev/" />

    <title>VAC-Tech Jr. — the IT club of Vishwa Adarsha Academy</title>
    <meta
      name="description"
      content="VAC-Tech Jr. is the IT club of Vishwa Adarsha Academy's +2 section — workshops, events and the projects our members build."
    />

    <!-- Open Graph / Twitter. Per-page titles and descriptions are set by
         src/components/shared/PageMeta.jsx; this is the share card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VAC-Tech Jr." />
    <meta property="og:image" content="https://vactechjr.pages.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VAC-Tech Jr. — the IT club of Vishwa Adarsha Academy" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://vactechjr.pages.dev/og.jpg" />

    <script>
      // The intro plays once per browser session, on the home page only. Set
      // before first paint so the site never flashes before the overlay appears.
      // If anything here throws, the site simply shows without the intro.
      try {
        var noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
        var introPlayed = sessionStorage.getItem('vacIntroPlayed') === '1'
        if (location.pathname === '/' && !noMotion && !introPlayed) {
          document.documentElement.classList.add('intro-on', 'rv-hide')
        }
      } catch (e) {}
    </script>
    <noscript>
      <!-- No JavaScript: make sure the intro cannot hide the page. -->
      <style>
        html.intro-on {
          overflow: auto !important;
        }
        html.intro-on .intro-root {
          display: none !important;
        }
        html.rv-hide .rv {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>VAC-Tech Jr. needs JavaScript. Please turn it on and reload.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
