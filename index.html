<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VAC-Tech Jr.</title>
    <meta
      name="description"
      content="VAC-Tech Jr. is the IT club of Vishwa Adarsha Academy +2. Workshops, events and student projects."
    />
    <script>
      // Set the theme before first paint so dark mode does not flash.
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
    <script>
      // The intro plays once per browser session, on the home page only. Set
      // before first paint so the site never flashes before the overlay appears.
      // If anything here throws, the site simply shows without the intro.
      try {
        var noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
        var introPlayed = sessionStorage.getItem('vacIntroPlayed') === '1'
        if (location.pathname === '/' && !noMotion && !introPlayed) {
          document.documentElement.classList.add('intro-on', 'rv-hide')
        }
      } catch (e) {}
    </script>
    <noscript>
      <!-- No JavaScript: make sure the intro cannot hide the page. -->
      <style>
        html.intro-on { overflow: auto !important; }
        html.intro-on .intro-root { display: none !important; }
        html.rv-hide .rv {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>VAC-Tech Jr. needs JavaScript. Please turn it on and reload.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
